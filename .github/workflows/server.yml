name: Sunucu

# server/ değişince Cloudflare Workers'a yükler. Gerekli secret'lar:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_KV_TRIAL_ID.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Cloudflare'e yükle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KV kimliği
        env:
          KV_ID: ${{ secrets.CLOUDFLARE_KV_TRIAL_ID }}
        run: |
          if [ -z "$KV_ID" ]; then
            echo "::error::CLOUDFLARE_KV_TRIAL_ID secret'ı yok."
            exit 1
          fi
          sed -i "s/KV_TRIAL_ID/$KV_ID/" server/wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
      - name: Adres
        run: echo "::notice title=Sunucu adresi::${{ steps.deploy.outputs.deployment-url }}"
      # Aynı kimlik ikinci kez sorulunca ilk başlangıç dönmeli; bozuk istek 400.
      - name: Deneme
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          sleep 5
          id=$(echo "ci-$GITHUB_RUN_ID" | sha256sum | cut -c1-64)
          now=$(($(date +%s) * 1000))
          a=$(curl -sf -X POST "$URL/v1/trial" -H 'content-type: application/json' -d "{\"id\":\"$id\",\"localStart\":$((now - 86400000))}")
          b=$(curl -sf -X POST "$URL/v1/trial" -H 'content-type: application/json' -d "{\"id\":\"$id\",\"localStart\":$now}")
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/trial" -d '{"id":"x"}')
          echo "::notice title=Sunucu denemesi::ilk=$a ikinci=$b bozuk=$bad"
          [ "$a" = "$b" ] && [ "$bad" = "400" ]
