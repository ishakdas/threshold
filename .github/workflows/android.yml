name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    name: Analiz ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Şimdilik debug anahtarıyla imzalanır; Play Store'a çıkmadan önce
      # yükleme anahtarı GitHub Secrets'a eklenecek.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/esik.apk
      # Tanı amaçlı ikinci APK: Impeller'ı Vulkan yerine OpenGL ES ile çalıştırır.
      # Bazı Samsung Exynos/Xclipse GPU'larda Vulkan ilk kareyi çizemeyebiliyor.
      - name: OpenGL ES sürümü
        run: |
          sed -i 's|android:icon="@mipmap/ic_launcher">|android:icon="@mipmap/ic_launcher">\n        <meta-data android:name="io.flutter.embedding.android.ImpellerBackend" android:value="opengles" />|' android/app/src/main/AndroidManifest.xml
          grep -q ImpellerBackend android/app/src/main/AndroidManifest.xml
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk dist/esik-opengles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: esik-${{ github.run_number }}-apk
          path: dist/*.apk
          retention-days: 30
