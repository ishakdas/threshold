name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    name: Analiz ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # JNI kullanan eklentiler sürüm derlemesinde R8 yüzünden çökebiliyor
      # (bkz. pubspec.yaml'daki shared_preferences_android notu). Yeni bir eklenti
      # JNI getirirse bilinçli karar verilsin diye derleme durur.
      - name: JNI bağımlılığı kontrolü
        run: |
          if grep -qE '^  jni:' pubspec.lock; then
            echo "::error::pubspec.lock'a 'jni' paketi girdi. Sürüm APK'sında NoSuchMethodError riski var; cihazda test edip bu kontrolü güncelleyin."
            exit 1
          fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Play Store yükleme anahtarı GitHub Secrets'ta varsa sürüm onunla
      # imzalanır ve Play'e yüklenecek AAB de üretilir. Yoksa (ör. dışarıdan
      # gelen PR) debug anahtarıyla yalnızca APK.
      - name: Yükleme anahtarı
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Yükleme anahtarı yok; APK debug anahtarıyla imzalanıyor."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      # Play'in veri güvenliği formu bu listeye dayanıyor; değişirse fark edilsin.
      - name: APK izinleri
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::warning::APK internet izni içeriyor; docs/play/console-formlari.md ve gizlilik politikası güncellenmeli."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: esik-${{ github.run_number }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Play Store paketi (AAB)
        if: steps.key.outputs.signed == 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: esik-${{ github.run_number }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
