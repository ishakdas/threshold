name: threshold
description: "Eşik — günün iki eşiğinde, doğru anda önüne gelen kontrol listesi."
publish_to: 'none'

version: 0.4.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# shared_preferences_android 2.5.x Android'le JNI üzerinden konuşuyor ve sürüm
# derlemesinde R8, yalnızca JNI'dan çağrılan metotları siliyor
# (NoSuchMethodError: SharedPreferencesApiRegistrar.getAll). Düzeltme yayımlanana
# kadar platform kanalı kullanan son sürüme sabitlenir.
dependency_overrides:
  shared_preferences_android: 2.4.28
